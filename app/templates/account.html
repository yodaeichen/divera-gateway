{% extends "base.html" %}
{% block content %}
<h1>Mein Konto</h1>
<div class="card">
  <p>Angemeldet als <strong>{{ user.username }}</strong>, Rolle: {{ role }}.</p>
  <h2>Passwort ändern</h2>
  <form method="post" action="/account" autocomplete="off">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label>Aktuelles Passwort</label><input type="password" name="current" required>
    <label>Neues Passwort</label><input type="password" name="password" minlength="12" autocomplete="new-password" required>
    <p class="hint">Mindestens 12 Zeichen.</p>
    <div class="actions"><button>Passwort ändern</button></div>
  </form>
</div>
{% endblock %}
