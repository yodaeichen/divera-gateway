{% extends "base.html" %}
{% block content %}
<div class="card login">
  <h1 class="loginbrand">DIVERA <span>Gateway</span><small>powered by yodaeichen</small></h1>
  <form method="post" action="/login">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label>Benutzername</label><input type="text" name="username" autofocus required>
    <label>Passwort</label><input type="password" name="password" required>
    <div class="actions"><button>Anmelden</button></div>
  </form>
</div>
{% endblock %}
