{% extends "base.html" %}
{% block content %}
<h1>Benutzer</h1>
<div class="card">
<table>
<tr><th>Benutzername</th><th>Neues Passwort setzen</th><th></th></tr>
{% for u in users %}
<tr>
  <td><strong>{{ u.username }}</strong>{% if u.id == user.id %} <span class="tag">du</span>{% endif %}</td>
  <td><form method="post" action="/users/save" style="display:flex;gap:8px">
    <input type="hidden" name="csrf" value="{{ csrf }}"><input type="hidden" name="id" value="{{ u.id }}">
    <input type="password" name="password" minlength="12" autocomplete="new-password" placeholder="mindestens 12 Zeichen" required><button class="light">Setzen</button></form></td>
  <td>{% if u.id != user.id %}<form method="post" action="/users/{{ u.id }}/delete"><input type="hidden" name="csrf" value="{{ csrf }}"><button class="link">Löschen</button></form>{% endif %}</td>
</tr>
{% endfor %}
</table>
</div>
<div class="card">
  <h2>Benutzer anlegen</h2>
  <form method="post" action="/users/save" autocomplete="off">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <div class="grid">
      <div><label>Benutzername</label><input type="text" name="username" required></div>
      <div><label>Passwort</label><input type="password" name="password" minlength="12" autocomplete="new-password" required></div>
    </div>
    <div class="actions"><button>Anlegen</button></div>
  </form>
  <p class="hint">Alle Benutzer dürfen alle Kunden verwalten.</p>
</div>
{% endblock %}
