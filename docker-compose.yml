services:
  gateway:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/data
    ports:
      # Nur für den Reverse Proxy erreichbar machen. Läuft der Proxy auf einem
      # anderen Host, hier die interne IP dieses Hosts statt 127.0.0.1 eintragen.
      - "127.0.0.1:8080:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
